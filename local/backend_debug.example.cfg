; GAME-003 local-only backend debug override — TEMPLATE.
;
; Copy this file to `local/backend_debug.cfg` (same folder) and edit the values there. That exact
; filename is gitignored (see .gitignore) and is read only by debug Godot exports/editor runs
; (scripts/save/local_backend_debug_bootstrap.gd checks OS.is_debug_build()). It is never committed
; and never ships in a release export.
;
; base_url must start with http:// or https://. With `adb reverse tcp:8080 tcp:8080` running,
; http://127.0.0.1:8080 reaches your developer-hosted backend from the Android emulator. Use
; http://10.0.2.2:8080 as the documented fallback when `adb reverse` is unavailable.
;
; Committed release defaults (project.godot) keep backend_base_url empty and save_sync_v2_enabled
; false; this file only affects your own local debug builds.

[backend]

base_url="http://127.0.0.1:8080"
sync_enabled=true
