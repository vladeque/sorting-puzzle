; GAME-003 Android debug export preset for the local-backend workflow.
;
; Confirm in Project > Export that Gradle Build is enabled and package/unique_name matches what you
; intend to register. Do not enable the preset's Internet permission: the debug AAR contributes
; INTERNET and cleartext HTTP only to debug exports, while release exports receive neither.
;
; This preset is for debug local-backend testing only. Committed release defaults
; (application/config/backend_base_url empty, application/config/save_sync_v2_enabled false in
; project.godot) are unaffected by this file and by any "Export Debug" build made with it; no
; backend host or secret is embedded here.

[preset.0]

name="Android (Local Backend Debug)"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/sorting_puzzle_local_backend_debug.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3"
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="35"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=1
version/name="0.1.0"
package/unique_name="com.sortingpuzzle.game"
package/name="SortingPuzzle"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
user_data_backup/allow=false
